name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pr.outputs.version }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '
            [
              .[]
              | select(.merged_at != null and .base.ref == "main" and .head.repo.full_name == env.GITHUB_REPOSITORY)
              | .head.ref
              | select(test("^release/(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              | sub("^release/"; "")
            ]
            | if length > 1 then error("multiple release pull requests") else (.[0] // "") end
          ')"
          printf 'version=%s\n' "$ref" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: success() && needs.gate.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Omit registry-url. setup-node would set NODE_AUTH_TOKEN and npm would skip OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check release
        env:
          RELEASE_HEAD_REF: release/${{ needs.gate.outputs.version }}
        run: node scripts/release.mjs check

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --provenance --access public

      - name: Publish to JSR
        run: npx --yes jsr@0.14.3 publish

  github-release:
    needs: [gate, publish]
    if: success() && needs.gate.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release.mjs notes > "${RUNNER_TEMP}/notes.md"
          gh release view "v${VERSION}" || gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
