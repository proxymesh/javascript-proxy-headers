# Checks a release pull request before merge. publish.yml publishes after the merge reaches main.
name: Release check

on:
  pull_request:

permissions: {}

jobs:
  check:
    name: Release check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check version and changelog
        env:
          RELEASE_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/create-release-pr.mjs --check

      - name: Test the release helper
        run: node --test scripts/release.test.mjs

      - name: Build package
        run: npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}"
